name: Linux setup
# Tests the installer and setup scripts on clean machines (scripts/test_setup.sh). Linux only,
# so it uses few minutes. Started by hand from the Actions tab, and by the release workflow.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  distros:
    name: Packages and checks on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test_setup.sh distro "${{ matrix.image }}"

  full:
    name: Full install through the release installer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test_setup.sh full
