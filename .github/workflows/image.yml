name: Pi image
# The ready-made Raspberry Pi image for a release, attached to it as slot17-VERSION-raspios-lite-arm64.img.xz.
# Run by the release workflow; or by hand (Actions > Pi image > Run workflow) for a release tag from
# 1.3.1 on, the first with the image's first-start setup.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.3.1"
        required: true

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # The tag's own scripts and first-start files, not the branch the run was started from: by hand, from
      # main, an older tag's image got today's firstboot.sh (found in review, 24 November 2026).
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support parted xz-utils e2fsprogs
      - name: Release files of ${{ inputs.tag }}
        run: bash scripts/make_release.sh "${{ inputs.tag }}"
      - name: Build the image
        run: sudo bash scripts/build_image.sh dist/slot17.tar.gz dist/install.sh "${{ inputs.tag }}" out
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # nullglob: an older tag's build_image.sh writes no made-from file
        run: |
          shopt -s nullglob
          gh release upload "${{ inputs.tag }}" out/*.img.xz out/*.img.xz.sha256 out/*.img.xz.made-from.txt --clobber
